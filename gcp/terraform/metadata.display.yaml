apiVersion: blueprints.cloud.google.com/v1alpha1
kind: BlueprintMetadata
metadata:
  name: amazon-cloud-watch-observability-display
  annotations:
    config.kubernetes.io/local-config: "true"
spec:
  info:
    title: Amazon CloudWatch Observability
    source: {}
  ui:
    input:
      variables:
        # --- Customer-facing fields ---
        project_id:
          name: project_id
          title: Project ID
          tooltip: The GCP project containing the existing GKE cluster to install onto.
        cluster_name:
          name: cluster_name
          title: Cluster Name
          tooltip: Name of your existing GKE cluster.
        cluster_location:
          name: cluster_location
          title: Cluster Location
          tooltip: Zone or region of your existing GKE cluster.
        helm_values_yaml:
          name: helm_values_yaml
          title: Configuration values
          tooltip: JSON or YAML overrides merged over the chart's defaults, the same as the EKS add-on's configuration values. Only the keys you set change. Image and k8sMode settings are managed by Marketplace and always overridden.
          subtext: Set clusterName, region and roleArn, then add only settings to change (max 9,000 characters). <a href="https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/install-CloudWatch-Observability-EKS-addon.html">Available settings</a>
          xGoogleProperty:
            type: ET_MULTI_LINE_STRING

        # --- Internal / validation-only — hidden from the customer-facing form ---
        goog_cm_deployment_name:
          name: goog_cm_deployment_name
          title: Deployment Name
          invisible: true
        create_cluster:
          name: create_cluster
          title: Create Cluster
          invisible: true
        helm_release_name:
          name: helm_release_name
          title: Helm Release Name
          invisible: true
        namespace:
          name: namespace
          title: Namespace
          invisible: true
        helm_chart_repo:
          name: helm_chart_repo
          title: Helm Chart Repo
          invisible: true
        helm_chart_name:
          name: helm_chart_name
          title: Helm Chart Name
          invisible: true
        helm_chart_version:
          name: helm_chart_version
          title: Helm Chart Version
          invisible: true

        # --- Image overrides — populated automatically by Marketplace, never shown ---
        auto_instrumentation_dotnet_image_registry:
          name: auto_instrumentation_dotnet_image_registry
          title: Auto Instrumentation Dotnet Image Registry
          invisible: true
