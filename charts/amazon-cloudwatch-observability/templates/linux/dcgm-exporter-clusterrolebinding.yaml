{{- if and .Values.dcgmExporter.enabled .Values.dcgmExporter.enableDRACorrelation }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ template "dcgm-exporter.name" . }}-dra-cluster-role-binding
  labels:
    {{- include "amazon-cloudwatch-observability.labels" . | nindent 4}}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ template "dcgm-exporter.name" . }}-dra-cluster-role
subjects:
- kind: ServiceAccount
  name: {{ template "dcgm-exporter.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
