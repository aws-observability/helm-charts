{{- if .Values.containerLogs.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: {{ .Release.Namespace }}
  labels:
    k8s-app: fluent-bit
data:
  fluent-bit.conf: |
    {{- include "fluent-bit.add-ipv6-preference" (dict "config" .Values.containerLogs.fluentBit.config.service "useDualstackEndpoint" .Values.useDualstackEndpoint "indent" "  ") | nindent 4 }}
    {{- range $key, $val := .Values.containerLogs.fluentBit.config.extraFiles }}
    {{- /* Skip files that render empty (e.g. host-log.conf when OTEL CI logs are active). */}}
    {{- if trim (tpl $val $) }}
    {{- $safeKey := include "fluent-bit.validatedConfigKey" $key }}
    @INCLUDE {{ $safeKey }}
    {{- end }}
    {{- end }}
  parsers.conf: |
    {{- .Values.containerLogs.fluentBit.config.customParsers  | nindent 4 }}
{{- range $key, $val := .Values.containerLogs.fluentBit.config.extraFiles }}
  {{- $safeKey := include "fluent-bit.validatedConfigKey" $key }}
  {{- /* tpl is required by supported endpoint substitutions in default extraFiles.
        nindent keeps all rendered content inside this ConfigMap literal block. */ -}}
  {{- $config := tpl $val $ }}
  {{- if trim $config }}
  {{ $safeKey | quote }}: |
    {{- include "fluent-bit.add-dualstack-endpoints" (dict "Values" $.Values "config" $config) | nindent 4 }}
  {{- end }}
{{- end -}}
{{- end -}}
