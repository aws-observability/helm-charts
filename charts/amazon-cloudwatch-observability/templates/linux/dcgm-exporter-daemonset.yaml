{{- if .Values.dcgmExporter.enabled }}
apiVersion: cloudwatch.aws.amazon.com/v1alpha1
kind: DcgmExporter
metadata:
  name: {{ include "dcgm-exporter.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    k8s-app: {{ include "dcgm-exporter.name" . }}
    version: v1
spec:
  image: {{ template "dcgm-exporter.image" . }}
  {{- with .Values.dcgmExporter.nodeSelector }}
  nodeSelector: {{- toYaml . | nindent 4 }}
  {{- end }}
  serviceAccount: {{ template "dcgm-exporter.serviceAccountName" . }}
  {{- if eq .Values.k8sMode "GKE" }}
  {{- /* The default affinity below matches AWS GPU instance-type families and never
     matches GKE nodes. On GKE, schedule onto any node carrying the standard GKE GPU
     node-pool label instead, regardless of accelerator model. */}}
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: cloud.google.com/gke-accelerator
                operator: Exists
  {{- else }}
  {{- with .Values.dcgmExporter.affinity }}
  affinity: {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  {{- with .Values.dcgmExporter.resources }}
  resources: {{- toYaml . | nindent 4}}
  {{- end }}
  {{- with .Values.dcgmExporter.securityContext }}
  securityContext: {{- toYaml . | nindent 4 }}
  {{- end }}
  env:
  - name: "DCGM_EXPORTER_KUBERNETES"
    value: "true"
  - name: "DCGM_EXPORTER_LISTEN"
    value: "{{ .Values.dcgmExporter.service.address }}"
  - name: NODE_NAME
    valueFrom:
      fieldRef:
        fieldPath: spec.nodeName
  {{- include "dcgm-exporter.env" . | nindent 2 }}
  {{- if eq .Values.k8sMode "GKE" }}
  {{- /* GKE's stock NVIDIA device-plugin model mounts the host driver's userspace
     libraries at /usr/local/nvidia/lib64, which the distroless image's own
     LD_LIBRARY_PATH doesn't include. Without this, dcgm-exporter stays "Running"
     and serves empty (zero-byte) metric responses instead of failing visibly. */}}
  - name: LD_LIBRARY_PATH
    value: /usr/local/nvidia/lib64:/lib/distroless
  {{- end }}
  ports:
  - name: "metrics"
    port: {{ .Values.dcgmExporter.service.port }}
  volumeMounts:
  - name: "pod-gpu-resources"
    readOnly: true
    mountPath: "/var/lib/kubelet/pod-resources"
  - mountPath: /etc/amazon-cloudwatch-observability-dcgm-cert
    name: dcgmtls
    readOnly: true
  volumes:
  - name: dcgmtls
    secret:
      secretName: amazon-cloudwatch-observability-agent-cert
      items:
        - key: tls.crt
          path: server.crt
        - key:  tls.key
          path: server.key
  - name: "pod-gpu-resources"
    hostPath:
      path: /var/lib/kubelet/pod-resources
  metricsConfig: |
    DCGM_FI_DEV_GPU_UTIL,      gauge, GPU utilization (in %).
    DCGM_FI_DEV_MEM_COPY_UTIL, gauge, Memory utilization (in %).
    DCGM_FI_DEV_FB_FREE, gauge, Framebuffer memory free (in MiB).
    DCGM_FI_DEV_FB_USED, gauge, Framebuffer memory used (in MiB).
    DCGM_FI_DEV_FB_TOTAL, gauge, Framebuffer memory used (in MiB).
    DCGM_FI_DEV_FB_USED_PERCENT, gauge, Percentage used of Frame Buffer: Used/(Total - Reserved).
    DCGM_FI_DEV_MEMORY_TEMP, gauge, Memory temperature (in C).
    DCGM_FI_DEV_GPU_TEMP,    gauge, GPU temperature (in C).
    DCGM_FI_DEV_POWER_USAGE,              gauge, Power draw (in W).
    {{- if ne .Values.k8sMode "GKE" }}
    {{- /* On GKE, the cluster-managed dcgm-exporter (namespace gke-managed-system)
       holds an exclusive lock on DCGM's profiling module, so watching this field
       here fails the whole field group and the exporter exits before serving any
       metric at all (see NVIDIA/dcgm-exporter#537). Drop it on GKE. */}}
    DCGM_FI_PROF_PIPE_TENSOR_ACTIVE, gauge, Tensor Core utilization (in %).
    {{- end }}
    DCGM_FI_DRIVER_VERSION, label, Driver Version.
  tlsConfig: |
    tls_server_config:
      cert_file: /etc/amazon-cloudwatch-observability-dcgm-cert/server.crt
      key_file: /etc/amazon-cloudwatch-observability-dcgm-cert/server.key
  {{- dict "component" .Values.dcgmExporter "context" . | include "amazon-cloudwatch-observability.common.tolerations" | nindent 2 }}
{{- end }}
