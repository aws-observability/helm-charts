{{- if .Values.containerLogs.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-windows-config
  namespace: {{ .Release.Namespace }}
  labels:
    k8s-app: fluent-bit
data:
  fluent-bit.conf: |
    {{- .Values.containerLogs.fluentBit.configWindows.service  | nindent 4 }}
    {{- range $key, $val := .Values.containerLogs.fluentBit.configWindows.extraFiles }}
    {{- $safeKey := include "fluent-bit.validatedConfigKey" $key }}
    @INCLUDE {{ $safeKey }}
    {{- end }}
  parsers.conf: |
    {{- .Values.containerLogs.fluentBit.configWindows.customParsers  | nindent 4 }}
  {{- range $key, $val := .Values.containerLogs.fluentBit.configWindows.extraFiles }}
  {{- $safeKey := include "fluent-bit.validatedConfigKey" $key }}
  {{ $safeKey | quote }}: |
    {{- /* tpl is required by supported endpoint substitutions in default extraFiles.
          nindent keeps all rendered content inside this ConfigMap literal block. */ -}}
    {{- (tpl $val $) | nindent 4 }}
  {{- end -}}
{{- end -}}