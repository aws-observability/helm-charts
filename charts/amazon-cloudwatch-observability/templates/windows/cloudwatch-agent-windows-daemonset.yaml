{{- if .Values.agent.enabled }}
{{- $clusterName := .Values.clusterName | required ".Values.clusterName is required." -}}
{{- $region := .Values.region | required ".Values.region is required." -}}
{{- $config := `{"logs":{"metrics_collected":{"application_signals":{}}},"traces":{"traces_collected":{"application_signals":{}}}}` | fromJson -}}
apiVersion: cloudwatch.aws.amazon.com/v1alpha1
kind: AmazonCloudWatchAgent
metadata:
  name: {{ printf "%s-windows" (include "cloudwatch-agent.name" .) | quote }}
  namespace: {{ .Release.Namespace }}
spec:
  podSecurityContext:
    windowsOptions:
      runAsUserName: "NT AUTHORITY\\System"
  image: {{ include "cloudwatch-agent.image" (merge .Values.agent.image (dict "region" .Values.region)) | quote }}
  mode: daemonset
  serviceAccount: {{ include "cloudwatch-agent.serviceAccountName" . | quote }}
  priorityClassName: {{ .Values.agent.priorityClassName | quote }}
  {{- $agentWinAnnotations := include "amazon-cloudwatch-observability.common.podAnnotations" (dict "component" .Values.agent "context" .) }}
  {{- with $agentWinAnnotations }}
  podAnnotations:
    {{- . | nindent 4 }}
  {{- end }}
  {{- include "amazon-cloudwatch-observability.common.topologySpreadConstraints" (dict "component" .Values.agent "context" .) | nindent 2 }}
  {{- $agentWinPdb := include "amazon-cloudwatch-observability.common.podDisruptionBudget" (dict "component" .Values.agent "context" .) | fromYaml }}
  {{- if $agentWinPdb.enabled }}
  podDisruptionBudget:
    {{- if hasKey $agentWinPdb "minAvailable" }}
    minAvailable: {{ $agentWinPdb.minAvailable }}
    {{- else if hasKey $agentWinPdb "maxUnavailable" }}
    maxUnavailable: {{ $agentWinPdb.maxUnavailable }}
    {{- end }}
  {{- end }}
  nodeSelector:
    kubernetes.io/os: windows
  config: {{ include "cloudwatch-agent.modify-config" (merge (dict "Config" $config) .) }}
  {{- with .Values.agent.resources }}
  resources: {{- toYaml . | nindent 4}}
  {{- end }}
  env:
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: HOST_IP
      valueFrom:
        fieldRef:
          fieldPath: status.hostIP
    - name: HOST_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: K8S_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
  {{- dict "component" .Values.agent "context" . | include "amazon-cloudwatch-observability.common.tolerations" | nindent 2 }}
{{- end }}