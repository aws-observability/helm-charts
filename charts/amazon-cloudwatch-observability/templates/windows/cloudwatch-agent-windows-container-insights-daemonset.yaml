{{- if .Values.agent.enabled }}
{{- $clusterName := .Values.clusterName | required ".Values.clusterName is required." -}}
{{- $region := .Values.region | required ".Values.region is required." -}}
{{- $config := `{"logs":{"metrics_collected":{"kubernetes":{"enhanced_container_insights":true}}}}` | fromJson -}}

apiVersion: cloudwatch.aws.amazon.com/v1alpha1
kind: AmazonCloudWatchAgent
metadata:
  name: {{ printf "%s-windows-container-insights" (include "cloudwatch-agent.name" .) | quote }}
  namespace: {{ .Release.Namespace }}
spec:
  podSecurityContext:
    windowsOptions:
      hostProcess: true
      runAsUserName: "NT AUTHORITY\\System"
  hostNetwork: true
  image: {{ include "cloudwatch-agent.image" (merge .Values.agent.image (dict "region" .Values.region)) | quote }}
  workingDir: "%CONTAINER_SANDBOX_MOUNT_POINT%\\Program Files\\Amazon\\AmazonCloudWatchAgent"
  mode: daemonset
  serviceAccount: {{ include "cloudwatch-agent.serviceAccountName" . | quote }}
  {{- $ciWinPcn := .Values.agent.priorityClassName | default (include "amazon-cloudwatch-observability.common.priorityClassName" (dict "component" .Values.agent "context" .)) }}
  {{- if $ciWinPcn }}
  priorityClassName: {{ $ciWinPcn | quote }}
  {{- end }}
  {{- $ciWinAnnotations := include "amazon-cloudwatch-observability.common.podAnnotations" (dict "component" .Values.agent "context" .) }}
  {{- with $ciWinAnnotations }}
  podAnnotations:
    {{- . | nindent 4 }}
  {{- end }}
  {{- include "amazon-cloudwatch-observability.common.topologySpreadConstraints" (dict "component" .Values.agent "context" .) | nindent 2 }}
  {{- $ciWinPdb := include "amazon-cloudwatch-observability.common.podDisruptionBudget" (dict "component" .Values.agent "context" .) | fromYaml }}
  {{- if $ciWinPdb.enabled }}
  podDisruptionBudget:
    {{- if hasKey $ciWinPdb "minAvailable" }}
    minAvailable: {{ $ciWinPdb.minAvailable }}
    {{- else if hasKey $ciWinPdb "maxUnavailable" }}
    maxUnavailable: {{ $ciWinPdb.maxUnavailable }}
    {{- end }}
  {{- end }}
  nodeSelector:
    kubernetes.io/os: windows
  config: {{ include "cloudwatch-agent.modify-config" (merge (dict "Config" $config) .) }}
  {{- with .Values.agent.resources }}
  resources: {{- toYaml . | nindent 4}}
  {{- end }}
  env:
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: HOST_IP
      valueFrom:
        fieldRef:
          fieldPath: status.hostIP
    - name: HOST_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: K8S_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: RUN_IN_CONTAINER
      value: "True"
    - name: RUN_AS_HOST_PROCESS_CONTAINER
      value: "True"
  {{- dict "component" .Values.agent "context" . | include "amazon-cloudwatch-observability.common.tolerations" | nindent 2 }}
{{- end }}