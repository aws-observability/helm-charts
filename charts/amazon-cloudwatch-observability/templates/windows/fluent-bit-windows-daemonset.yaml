{{- if .Values.containerLogs.enabled }}
{{- $clusterName := .Values.clusterName | required ".Values.clusterName is required." -}}
{{- $region := .Values.region | required ".Values.region is required." -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit-windows
  namespace: {{ .Release.Namespace }}
  labels:
    k8s-app: fluent-bit
    version: v1
    kubernetes.io/cluster-service: "true"
spec:
  selector:
    matchLabels:
      k8s-app: fluent-bit
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/windows/fluent-bit-windows-configmap.yaml") . | sha256sum }}
        {{- $fbwAnnotations := include "amazon-cloudwatch-observability.common.podAnnotations" (dict "component" .Values.containerLogs.fluentBit "context" .) }}
        {{- with $fbwAnnotations }}
        {{- . | nindent 8 }}
        {{- end }}
      labels:
        k8s-app: fluent-bit
        version: v1
        kubernetes.io/cluster-service: "true"
        {{- $fbwLabels := include "amazon-cloudwatch-observability.common.podLabels" (dict "component" .Values.containerLogs.fluentBit "context" .) }}
        {{- with $fbwLabels }}
        {{- . | nindent 8 }}
        {{- end }}
    spec:
      securityContext:
        windowsOptions:
          hostProcess: true
          runAsUserName: "NT AUTHORITY\\System"
      hostNetwork: true
      {{- $fbwPcn := include "amazon-cloudwatch-observability.common.priorityClassName" (dict "component" .Values.containerLogs.fluentBit "context" .) }}
      {{- if $fbwPcn }}
      priorityClassName: {{ $fbwPcn | quote }}
      {{- end }}
      nodeSelector:
        kubernetes.io/os: windows
      containers:
      - name: fluent-bit
        image: {{ include "fluent-bit-windows.image" . | quote }}
        imagePullPolicy: Always
        command: ["powershell.exe", "-Command", "New-Item -ItemType Directory -Path C:\\var\\fluent-bit\\state -Force;", "%CONTAINER_SANDBOX_MOUNT_POINT%/fluent-bit/bin/fluent-bit.exe", "-e", "%CONTAINER_SANDBOX_MOUNT_POINT%/fluent-bit/kinesis.dll", "-e", "%CONTAINER_SANDBOX_MOUNT_POINT%/fluent-bit/firehose.dll", "-e", "%CONTAINER_SANDBOX_MOUNT_POINT%/fluent-bit/cloudwatch.dll", "-c", "%CONTAINER_SANDBOX_MOUNT_POINT%/fluent-bit/configuration/fluent-bit.conf"]
        env:
        - name: AWS_REGION
          value: {{ .Values.region | quote }}
        - name: CLUSTER_NAME
          value: {{ .Values.clusterName | quote }}
        - name: READ_FROM_HEAD
          value: "Off"
        - name: HOST_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: CI_VERSION
          value: "k8s/1.3.17"
        {{- with .Values.containerLogs.fluentBit.resources }}
        resources: {{- toYaml . | nindent 10}}
        {{- end }}
        {{- with .Values.containerLogs.fluentBit.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10}}
        {{- end }}
        volumeMounts:
          - name: fluent-bit-config
            mountPath: fluent-bit\configuration\
      volumes:
        - name: fluent-bit-config
          configMap:
            name: fluent-bit-windows-config
      terminationGracePeriodSeconds: 10
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: {{ include "cloudwatch-agent.serviceAccountName" . | quote }}
      {{- include "amazon-cloudwatch-observability.common.topologySpreadConstraints" (dict "component" .Values.containerLogs.fluentBit "context" .) | nindent 6 }}
      {{- dict "component" .Values.containerLogs.fluentBit "context" . | include "amazon-cloudwatch-observability.common.tolerations" | nindent 6 }}
{{- end }}