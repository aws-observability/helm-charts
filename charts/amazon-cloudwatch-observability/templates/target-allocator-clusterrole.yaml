{{- if .Values.agent.enabled }}
{{- /*
  All Target Allocators (targetAgent and clusterScraperAgent) default to the same
  ServiceAccount (target-allocator-service-acct; see operator serviceaccount.go), so a single
  ClusterRole covers every TA. Pre-scan the agents to decide whether any TA (and any
  prometheusCR discovery) is enabled, then render exactly once to avoid duplicate-name objects.
*/}}
{{- $needsTA := false }}
{{- $needsCR := false }}
{{- range $i, $customAgent := .Values.agents }}
{{- /* Merge the singular .Values.agent block (where prometheus.targetAllocator.* lives)
       into each agents entry, mirroring the CR template, so enabling discovery via the
       singular agent (agent.prometheus.targetAllocator.prometheusCR.enabled) also grants
       the TA RBAC below -- not just enabling it on an agents entry. */}}
{{- $customAgent := mergeOverwrite (deepCopy $.Values.agent) $customAgent }}
{{- /* Resolve the agent name with the helper cloudwatch-agent-custom-resource.yaml uses, so
       an agents[] entry without a name gets RBAC when its CR renders a Target Allocator. */}}
{{- $agentName := include "cloudwatch-agent.resolvedName" (dict "agent" $customAgent "context" $) }}
{{- $promMonitor := eq (include "cloudwatch-agent.prometheusMonitorEnabled" (dict "agentName" $agentName "context" $)) "true" }}
{{- if or (and (hasKey ($customAgent.prometheus) "targetAllocator") (hasKey ($customAgent.prometheus.targetAllocator) "enabled") $customAgent.prometheus.targetAllocator.enabled) $promMonitor }}
{{- $needsTA = true }}
{{- end }}
{{- if or (and (hasKey ($customAgent.prometheus) "targetAllocator") (hasKey ($customAgent.prometheus.targetAllocator) "enabled") $customAgent.prometheus.targetAllocator.enabled (hasKey ($customAgent.prometheus.targetAllocator) "prometheusCR") $customAgent.prometheus.targetAllocator.prometheusCR.enabled) $promMonitor }}
{{- $needsCR = true }}
{{- end }}
{{- end }}
{{- if $needsTA }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "amazon-cloudwatch-observability.labels" $ | nindent 4}}
  name: "cloudwatch-agent-target-allocator-role"
rules:
  - apiGroups: [ "" ]
    resources: [ "pods", "nodes", "nodes/metrics", "services", "endpoints" ]
    verbs: [ "list", "watch", "get" ]
  - apiGroups: [ "" ]
    resources: [ "configmaps" ]
    verbs: [ "get" ]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [ "networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
  {{- if $needsCR }}
  - apiGroups: [ "monitoring.coreos.com"]
    resources: ["podmonitors", "servicemonitors"]
    verbs: ["get", "list", "watch"]
  # TA watches the SM/PM CRDs to start/stop informers as they appear or disappear (read-only).
  - apiGroups: [ "apiextensions.k8s.io" ]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  {{- $pm := $.Values.otelPrometheusMonitor | default dict }}
  {{- if and (dig "enabled" false $pm) (dig "readSecrets" false $pm) }}
  # otelPrometheusMonitor.readSecrets: read the Secrets that monitors reference for
  # basicAuth, authorization, oauth2 and tlsConfig. get only: the TA reads each Secret by
  # the name in the monitor and never lists or watches Secrets.
  - apiGroups: [ "" ]
    resources: ["secrets"]
    verbs: ["get"]
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
