{{- if and .Values.admissionWebhooks.create .Values.admissionWebhooks.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  {{- if .Values.admissionWebhooks.certManager.certificateAnnotations }}
  annotations:
    {{- toYaml .Values.admissionWebhooks.certManager.certificateAnnotations | nindent 4 }}
  {{- end }}
  labels:
    {{- include "amazon-cloudwatch-observability.labels" . | nindent 4 }}
  name: {{ template "amazon-cloudwatch-observability.name" . }}-serving-cert
  namespace: {{ .Release.Namespace }}
spec:
  dnsNames:
    - {{ template "amazon-cloudwatch-observability.name" .}}-webhook-service.{{ .Release.Namespace }}
    - {{ template "amazon-cloudwatch-observability.name" .}}-webhook-service.{{ .Release.Namespace }}.svc
    - {{ template "amazon-cloudwatch-observability.name" .}}-webhook-service.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    {{- if .Values.admissionWebhooks.certManager.issuerRef }}
    {{- toYaml .Values.admissionWebhooks.certManager.issuerRef | nindent 4 }}
    {{- else }}
    kind: Issuer
    name: {{ template "amazon-cloudwatch-observability.name" . }}-selfsigned-issuer
    {{- end }}
  secretName: {{ template "amazon-cloudwatch-observability.certificateSecretName" . }}
  subject:
    organizationalUnits:
      - {{ template "amazon-cloudwatch-observability.name" . }}
{{- if not .Values.admissionWebhooks.certManager.issuerRef }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  {{- if .Values.admissionWebhooks.certManager.issuerAnnotations }}
  annotations:
  {{- toYaml .Values.admissionWebhooks.certManager.issuerAnnotations | nindent 4 }}
  {{- end }}
  labels:
    {{- include "amazon-cloudwatch-observability.labels" . | nindent 4 }}
  name: {{ template "amazon-cloudwatch-observability.name" . }}-selfsigned-issuer
  namespace: {{ .Release.Namespace }}
spec:
  selfSigned: { }
{{- end }}
{{- end }}

{{- if ( .Values.agent.certManager.enabled) }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  {{- with .Values.agent.certManager.certificateAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "amazon-cloudwatch-observability.labels" . | nindent 4 }}
  name: "amazon-cloudwatch-observability-agent-cert"
  namespace: {{ .Release.Namespace }}
spec:
  dnsNames:
    {{- range $i, $customAgent := .Values.agents }}
    {{- $customAgentName := include "cloudwatch-agent.validatedName" ($customAgent.name | default (include "cloudwatch-agent.name" $)) }}
    - {{ printf "%s-target-allocator-service" $customAgentName | quote }}
    {{- end }}
    - "dcgm-exporter-service"
    - "dcgm-exporter-service.{{ .Release.Namespace }}.svc"
    - "neuron-monitor-service"
    - "neuron-monitor-service.{{ .Release.Namespace }}.svc"
    - "node-exporter-service"
    - "node-exporter-service.{{ .Release.Namespace }}.svc"
    - {{ include "kube-state-metrics.name" . | quote }}
    - {{ printf "%s.%s.svc" (include "kube-state-metrics.name" .) .Release.Namespace | quote }}
  issuerRef:
    {{- include "amazon-cloudwatch-observability.agentCertIssuerRef" . | nindent 4 }}
  secretName: "amazon-cloudwatch-observability-agent-cert"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  {{- with .Values.agent.certManager.certificateAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "amazon-cloudwatch-observability.labels" . | nindent 4 }}
  name: "amazon-cloudwatch-observability-agent-server-cert"
  namespace: {{ .Release.Namespace }}
spec:
  commonName: "agent-server"
  dnsNames:
    - "cloudwatch-agent"
    - "cloudwatch-agent.{{ .Release.Namespace }}.svc"
  issuerRef:
    {{- include "amazon-cloudwatch-observability.agentCertIssuerRef" . | nindent 4 }}
  secretName: "amazon-cloudwatch-observability-agent-server-cert"
  usages:
    - digital signature
    - key encipherment
    - cert sign
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  {{- with .Values.agent.certManager.certificateAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "amazon-cloudwatch-observability.labels" . | nindent 4 }}
  name: "amazon-cloudwatch-observability-agent-client-cert"
  namespace: {{ .Release.Namespace }}
spec:
  commonName: "agent-client"
  issuerRef:
    {{- include "amazon-cloudwatch-observability.agentCertIssuerRef" . | nindent 4 }}
  secretName: "amazon-cloudwatch-observability-agent-client-cert"
  usages:
    - digital signature
    - key encipherment
    - cert sign
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  {{- with .Values.agent.certManager.certificateAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "amazon-cloudwatch-observability.labels" . | nindent 4 }}
  name: "amazon-cloudwatch-observability-agent-ta-client-cert"
  namespace: {{ .Release.Namespace }}
spec:
  commonName: "agent-ta-client"
  issuerRef:
    {{- include "amazon-cloudwatch-observability.agentCertIssuerRef" . | nindent 4 }}
  secretName: "amazon-cloudwatch-observability-agent-ta-client-cert"
  usages:
    - digital signature
    - key encipherment
    - cert sign
{{- if not .Values.agent.certManager.issuerRef }}
{{- /*
The agent, cluster scraper, target allocator and scrape targets verify each other
with the ca.crt of a different Secret than the one holding the peer's tls.crt, so
every agent certificate must be signed by one CA, as with agent.autoGenerateCert.
A selfSigned Issuer would make each Certificate its own CA, so it only bootstraps
the CA certificate here, and the leaf certificates use a CA Issuer. The CA Issuer
has a new name so that releases created with the old selfSigned "agent-ca" Issuer
see a changed issuerRef and cert-manager reissues their certificates on upgrade.
*/}}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  labels:
    {{- include "amazon-cloudwatch-observability.labels" . | nindent 4 }}
  name: "agent-selfsigned"
  namespace: {{ .Release.Namespace }}
spec:
  selfSigned: { }
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  {{- with .Values.agent.certManager.certificateAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "amazon-cloudwatch-observability.labels" . | nindent 4 }}
  name: "amazon-cloudwatch-observability-agent-ca"
  namespace: {{ .Release.Namespace }}
spec:
  isCA: true
  commonName: "agent-ca"
  issuerRef:
    kind: Issuer
    name: "agent-selfsigned"
  secretName: "amazon-cloudwatch-observability-agent-ca"
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  {{- if .Values.agent.certManager.issuerAnnotations }}
  annotations:
  {{- toYaml .Values.agent.certManager.issuerAnnotations | nindent 4 }}
  {{- end }}
  labels:
    {{- include "amazon-cloudwatch-observability.labels" . | nindent 4 }}
  name: "agent-ca-issuer"
  namespace: {{ .Release.Namespace }}
spec:
  ca:
    secretName: "amazon-cloudwatch-observability-agent-ca"
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  labels:
    {{- include "amazon-cloudwatch-observability.labels" . | nindent 4 }}
  name: "amazon-cloudwatch-observability-agent-cert"
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  labels:
    {{- include "amazon-cloudwatch-observability.labels" . | nindent 4 }}
  name: "amazon-cloudwatch-observability-agent-server-cert"
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  labels:
    {{- include "amazon-cloudwatch-observability.labels" . | nindent 4 }}
  name: "amazon-cloudwatch-observability-agent-client-cert"
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  labels:
    {{- include "amazon-cloudwatch-observability.labels" . | nindent 4 }}
  name: "amazon-cloudwatch-observability-agent-ta-client-cert"
  namespace: {{ .Release.Namespace }}
{{- end }}
