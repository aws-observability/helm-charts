{{/*
PodDisruptionBudgets for chart workloads.

Each PDB is opt-in via `podDisruptionBudget.enabled` (root or component-level).
Component-level `podDisruptionBudget` overrides root when defined.

Naming: every PDB has a `-pdb` suffix so it does not collide with the workload
resource name.

DaemonSet-backed workloads (fluent-bit, node-exporter) deliberately get NO
chart-owned PDB:
  * `kubectl drain` skips DaemonSet-managed pods, so a PDB provides no drain
    protection.
  * A PDB whose selector targets pods of a controller without the scale
    subresource (DaemonSets) can only sync when `minAvailable` is an integer.
    With `maxUnavailable` (this chart's default) the PDB is permanently
    `SyncFailed` with `disruptionsAllowed: 0`, which actively BLOCKS
    eviction-API evictions of those pods instead of budgeting them.
  Verified against a live cluster; see the K8s docs on "Arbitrary workloads
  and arbitrary selectors" for PodDisruptionBudget.

CRD-managed workloads:
  AmazonCloudWatchAgent — PDB is emitted via the CR `spec.podDisruptionBudget`
    field in `linux/cloudwatch-agent-custom-resource.yaml` and the Windows CR
    templates. The operator provisions the PDB resource for
    deployment/statefulset-mode agents only.
  DcgmExporter, NeuronMonitor — operator CRDs do not support a PDB field today,
    and both run as DaemonSets (see caveat above).
*/}}

{{/* -------- Operator (controller-manager Deployment) -------- */}}
{{- $mgrPdb := include "amazon-cloudwatch-observability.common.podDisruptionBudget" (dict "component" .Values.manager "context" .) | fromYaml }}
{{- if $mgrPdb.enabled }}
{{ include "amazon-cloudwatch-observability.renderPodDisruptionBudget" (dict
    "name" (printf "%s-controller-manager-pdb" (include "amazon-cloudwatch-observability.name" .))
    "namespace" .Release.Namespace
    "selector" (dict "app.kubernetes.io/name" (include "amazon-cloudwatch-observability.name" .) "control-plane" "controller-manager")
    "pdb" $mgrPdb
    "ctx" .) }}
{{- end }}

{{/* -------- Kube State Metrics Deployment -------- */}}
{{- if and .Values.kubeStateMetrics.enabled .Values.otelContainerInsights.enabled }}
{{- $ksmPdb := include "amazon-cloudwatch-observability.common.podDisruptionBudget" (dict "component" .Values.kubeStateMetrics "context" .) | fromYaml }}
{{- if $ksmPdb.enabled }}
---
{{ include "amazon-cloudwatch-observability.renderPodDisruptionBudget" (dict
    "name" (printf "%s-pdb" (include "kube-state-metrics.name" .))
    "namespace" .Release.Namespace
    "selector" (dict "app.kubernetes.io/component" (include "kube-state-metrics.name" .))
    "pdb" $ksmPdb
    "ctx" .) }}
{{- end }}
{{- end }}
