name: Azure Marketplace Release

# Publishes the amazon-cloudwatch-observability chart to Azure Marketplace as a
# Kubernetes application (CNAB bundle).
#
#   1. Build the Marketplace bundle with CPA and push it to ACR
#   2. Replace the plan's technical-configuration package (delete + add)
#   3. Verify the digest Partner Center reports matches what we built
#
# Final publication stays MANUAL in Partner Center once Azure-side validation
# passes. This workflow never calls go-live.
#
# TRIGGER
# -------
# A chart release tag pushed to this repo: amazon-cloudwatch-observability-x.y.z
# The x.y.z in the tag is the Marketplace plan version, and it must match the
# version in Chart.yaml at the tagged commit - see "Resolve release version".
#
# To re-run a release by hand, open "Run workflow" and pick the release TAG as
# the ref (not main), otherwise the checkout and the version will not agree.
#
# RUNNER
# ------
# The three Azure jobs run on a self-hosted runner: an Azure VM whose
# system-assigned managed identity authenticates to Azure. No client secret and
# no OIDC federation to configure - the VM is itself the credential.
# The notification jobs stay on GitHub-hosted runners deliberately, so a release
# still reports failure when the VM is down.

on:
  push:
    tags:
      - 'amazon-cloudwatch-observability-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (defaults to the selected ref)'
        required: false
        type: string
      dry_run:
        description: 'Build and push to ACR only; do not touch Partner Center'
        required: false
        type: boolean
        default: true
      publish_target:
        description: 'Where to publish after the digest is verified'
        required: false
        type: choice
        options: [preview, live, none]
        default: preview

permissions:
  contents: read
  # Required by the Partner Center jobs, which federate an app registration
  # into Entra ID over OIDC. build-bundle does not use it - it authenticates
  # with the runner VM's managed identity.
  id-token: write

# Two releases must never race each other into the same plan.
concurrency:
  group: azure-marketplace-release
  cancel-in-progress: false

env:
  AZURE_DIR: azure
  # The chart is NOT committed under azure/. It lives in its normal place in the
  # repo and is copied into azure/ at build time, so there is one source of
  # truth for the chart and no risk of the two copies drifting apart.
  CHART_NAME: amazon-cloudwatch-observability
  CHART_SRC: charts/amazon-cloudwatch-observability
  CPA_IMAGE: mcr.microsoft.com/container-package-app:latest

jobs:
  # ---------------------------------------------------------------------------
  # Fires immediately so the team knows a release started.
  # ---------------------------------------------------------------------------
  notify-start:
    name: Notify - started
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Mapped at job level: the `secrets` context is not available in step `if`.
    env:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL_MARKETPLACE }}
    steps:
      - name: Slack
        if: env.SLACK_WEBHOOK != ''
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_MARKETPLACE }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":rocket: Azure Marketplace release started",
              "tag": "${{ inputs.tag || github.ref_name }}",
              "dry_run": "${{ inputs.dry_run || false }}",
              "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
  # ---------------------------------------------------------------------------
  # 1. Build the Marketplace bundle and push it to ACR.
  # ---------------------------------------------------------------------------
  build-bundle:
    name: Build bundle and push to ACR
    # Self-hosted Azure VM: linux/amd64 with Docker, which CPA requires.
    runs-on: [self-hosted, linux, x64, azure-marketplace]
    timeout-minutes: 60
    # Every Azure job shares this environment so they all present the same OIDC
    # subject, and one federated credential covers the whole workflow. Note that
    # adding required reviewers here would gate the build, not just the publish.
    environment: azure-marketplace
    outputs:
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      # CPA runs as root inside its container with the workspace bind-mounted,
      # so it leaves root-owned files behind (azure/.cnab). On a self-hosted
      # runner the workspace survives between jobs, and actions/checkout - which
      # runs as the runner user - then fails its clean step with
      # "EACCES: permission denied, scandir .../azure/.cnab".
      # Hosted runners never hit this because the whole VM is discarded.
      - name: Reclaim workspace from the previous run
        run: |
          set -uo pipefail
          WS="${GITHUB_WORKSPACE:-}"
          if [[ -z "$WS" || ! -d "$WS" ]]; then
            echo "no workspace to reclaim"
            exit 0
          fi
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R "$(id -u):$(id -g)" "$WS" 2>/dev/null || true
            echo "reclaimed $WS for $(id -un)"
          else
            echo "sudo unavailable - skipping (expected on hosted runners)"
          fi

      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: meta
        env:
          RAW: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -z "${RAW:-}" ]]; then
            echo "::error::could not determine a release tag"
            exit 1
          fi
          # amazon-cloudwatch-observability-6.7.0 -> 6.7.0
          VERSION="${RAW#${CHART_NAME}-}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'${RAW}' is not a chart release tag. Expected ${CHART_NAME}-x.y.z"
            echo "::error::(running from a branch? pick the release tag as the ref in \"Run workflow\")"
            exit 1
          fi
          # The tag names a chart version, so the tagged tree must agree with it.
          # A mismatch means the wrong commit was tagged, and shipping it would
          # put the wrong chart behind that Marketplace version.
          CHART_VERSION=$(grep -E '^version:' "${CHART_SRC}/Chart.yaml" \
            | head -1 | awk '{print $2}' | tr -d '"')
          if [[ "$CHART_VERSION" != "$VERSION" ]]; then
            echo "::error::tag says ${VERSION} but ${CHART_SRC}/Chart.yaml at this ref says ${CHART_VERSION}"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing chart version ${VERSION} (tag ${RAW})"
      - name: Verify expected repo layout
        run: |
          set -euo pipefail
          # Static Marketplace files, committed under azure/.
          for f in "${AZURE_DIR}/manifest.yaml" \
                   "${AZURE_DIR}/mainTemplate.json" \
                   "${AZURE_DIR}/createUIDefinition.json" \
                   "${AZURE_DIR}/README.md"; do
            [[ -f "$f" ]] || { echo "::error::missing required file: $f"; exit 1; }
          done
          # Chart source, copied in by the next step.
          [[ -f "${CHART_SRC}/Chart.yaml" ]] || {
            echo "::error::chart source not found at ${CHART_SRC}/Chart.yaml"; exit 1; }
          echo "Layout OK"
      - name: Stage chart into azure/
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          DEST="${AZURE_DIR}/${CHART_NAME}"
          # Remove any stale copy so a renamed or deleted chart file cannot
          # survive into the bundle.
          rm -rf "$DEST"
          cp -R "${CHART_SRC}" "$DEST"
          # Assert the copy actually landed - cp can partially succeed.
          [[ -f "${DEST}/Chart.yaml" ]]  || { echo "::error::staging failed: ${DEST}/Chart.yaml"; exit 1; }
          [[ -f "${DEST}/values.yaml" ]] || { echo "::error::staging failed: ${DEST}/values.yaml"; exit 1; }
          [[ -d "${DEST}/templates" ]]   || { echo "::error::staging failed: ${DEST}/templates"; exit 1; }
          echo "Staged ${CHART_SRC} -> ${DEST}"
          {
            echo "### Chart staged"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| tag | \`${{ inputs.tag || github.ref_name }}\` |"
            echo "| source | \`${CHART_SRC}\` |"
            echo "| destination | \`${DEST}\` |"
            echo "| version | \`${VERSION}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
      # The published chart is an AKS artifact: images must resolve to the
      # Marketplace registry (global.azure.enabled) and the AWS-specific values
      # become placeholders that mainTemplate.json fills in at install time.
      # Every edit asserts it matched exactly once - a silent miss here would
      # ship a bundle pointing at the wrong registry or the wrong cluster.
      - name: Patch staged chart for Marketplace
        run: |
          set -euo pipefail
          DEST="${AZURE_DIR}/${CHART_NAME}"
          python3 - "${DEST}/values.yaml" <<'PY'
          import re, sys, pathlib

          p = pathlib.Path(sys.argv[1])
          src = p.read_text()
          changes = []

          def fail(msg):
              print(f"::error::patch failed: {msg}")
              sys.exit(1)

          # --- global.azure.enabled -> true -------------------------------
          # Anchored to the global: > azure: block. A bare '^    enabled:'
          # match would hit unrelated keys elsewhere in values.yaml.
          lines = src.splitlines()
          gi = next((i for i, l in enumerate(lines) if l == "global:"), None)
          if gi is None:
              fail("no top-level 'global:' key")
          ai = None
          for i in range(gi + 1, len(lines)):
              if lines[i] and not lines[i][0].isspace():
                  break
              if lines[i] == "  azure:":
                  ai = i
                  break
          if ai is None:
              fail("no 'global.azure:' key")
          ei = None
          for i in range(ai + 1, len(lines)):
              if lines[i] and not lines[i].startswith("    "):
                  break
              if re.match(r"^    enabled: (true|false)\s*$", lines[i]):
                  ei = i
                  break
          if ei is None:
              fail("no 'global.azure.enabled' key")
          changes.append(("global.azure.enabled", lines[ei].strip(), "enabled: true"))
          lines[ei] = "    enabled: true"
          src = "\n".join(lines) + ("\n" if src.endswith("\n") else "")

          # --- top-level scalars ------------------------------------------
          for key, replacement in [
              ("clusterName", 'clusterName: "REPLACE_WITH_CLUSTER_NAME"'),
              ("region",      'region: "REPLACE_WITH_AWS_REGION"'),
              ("k8sMode",     "k8sMode: AKS"),
              ("roleArn",     'roleArn: "arn:aws:iam::000000000000:role/REPLACE_WITH_ROLE"'),
          ]:
              pat = re.compile(rf"^{key}:.*$", re.M)
              hits = pat.findall(src)
              if len(hits) != 1:
                  fail(f"expected exactly one top-level '{key}:', found {len(hits)}")
              changes.append((key, hits[0].strip(), replacement))
              src = pat.sub(lambda _m: replacement, src, count=1)

          p.write_text(src)
          for k, before, after in changes:
              print(f"  {k}\n      before: {before}\n      after : {after}")
          PY

          echo
          echo "=== patched values (verification) ==="
          grep -nE '^clusterName:|^region:|^k8sMode:|^roleArn:' "${DEST}/values.yaml"
          sed -n '/^global:/,/^    images:/p' "${DEST}/values.yaml" | head -4

          # Fail loudly if any placeholder did not land.
          for expect in 'clusterName: "REPLACE_WITH_CLUSTER_NAME"' \
                        'region: "REPLACE_WITH_AWS_REGION"' \
                        'k8sMode: AKS' \
                        'REPLACE_WITH_ROLE'; do
            grep -qF "$expect" "${DEST}/values.yaml" || {
              echo "::error::post-patch check failed, missing: $expect"; exit 1; }
          done
          {
            echo "### Chart patched for Marketplace"
            echo ""
            echo "| key | value |"
            echo "|---|---|"
            echo "| global.azure.enabled | \`true\` |"
            echo "| clusterName | \`REPLACE_WITH_CLUSTER_NAME\` |"
            echo "| region | \`REPLACE_WITH_AWS_REGION\` |"
            echo "| k8sMode | \`AKS\` |"
            echo "| roleArn | \`...:role/REPLACE_WITH_ROLE\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          # One identity for the whole workflow. This job needs the
          # subscription, because it pushes to and reads back from ACR.
          client-id: ${{ vars.PARTNER_CENTER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: |
          set -euo pipefail
          az acr login -n "${{ vars.ACR_NAME }}"
      - name: Build Marketplace bundle (CPA)
        run: |
          set -euo pipefail
          # NOTE: no -it here. The documented command uses -it, which fails in CI
          # because the runner has no TTY.
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${GITHUB_WORKSPACE}:/data" \
            -v "${HOME}/.docker:/root/.docker" \
            -w "/data/${AZURE_DIR}" \
            --entrypoint /bin/bash \
            "${CPA_IMAGE}" \
            -c "cpa buildbundle"
      - name: Resolve bundle digest from ACR
        id: digest
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          REPO="${{ vars.ACR_REPOSITORY }}"
          DIGEST=$(az acr manifest show-metadata \
            --registry "${{ vars.ACR_NAME }}" \
            --name "${REPO}:${VERSION}" \
            --query digest -o tsv)
          # Assert on the value, not just the exit code.
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::bundle not found in ACR or digest malformed: '${DIGEST}'"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          {
            echo "### Bundle pushed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| registry | \`${{ vars.ACR_NAME }}\` |"
            echo "| repository | \`${REPO}\` |"
            echo "| tag | \`${VERSION}\` |"
            echo "| digest | \`${DIGEST}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
  # ---------------------------------------------------------------------------
  # 2. Attach the bundle to the Marketplace plan.
  #
  # Called against the Product Ingestion API directly rather than through the
  # `partnercenter` az extension. The extension in the official az index (0.2.4)
  # sends a retired schema host and fails EVERY write with 400; the fix exists
  # only as a GitHub pre-release that will not install against a current az.
  # See Azure/partnercenter-cli-extension issues #235 and #245.
  #
  # Two hosts are involved and their tokens are NOT interchangeable:
  #   PC_API  metadata  (products, plans)   aud api.partner.microsoft.com
  #   PI_API  config    (read + configure)  aud graph.microsoft.com
  # ---------------------------------------------------------------------------
  update-package:
    name: Replace Marketplace package
    needs: build-bundle
    if: ${{ !(inputs.dry_run || false) }}
    runs-on: [self-hosted, linux, x64, azure-marketplace]
    timeout-minutes: 60
    environment: azure-marketplace
    outputs:
      product: ${{ steps.ids.outputs.product }}
      variant: ${{ steps.ids.outputs.variant }}
    env:
      VERSION: ${{ needs.build-bundle.outputs.version }}
      PC_API: https://api.partner.microsoft.com/v1.0/ingestion
      PI_API: https://graph.microsoft.com/rp/product-ingestion
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.PARTNER_CENTER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Resolve Partner Center identifiers
        id: ids
        run: |
          set -euo pipefail
          TOKEN=$(az account get-access-token --resource https://api.partner.microsoft.com --query accessToken -o tsv)
          echo "::add-mask::${TOKEN}"

          # The unfiltered product list is paged, so always filter. Matching on
          # type as well as value - a bare value match returns nothing.
          PRODUCT=$(curl -fsSL -G \
            -H "Authorization: Bearer ${TOKEN}" -H 'Accept: application/json' \
            --data-urlencode "\$filter=externalIDs/Any(i:i/type eq 'AzureOfferId' and i/value eq '${{ vars.MARKETPLACE_OFFER_ID }}')" \
            "${PC_API}/products" | jq -r '.value[0].id // empty')
          if [[ -z "$PRODUCT" ]]; then
            echo "::error::offer '${{ vars.MARKETPLACE_OFFER_ID }}' not found in this Partner Center account"
            exit 1
          fi

          VARIANT=$(curl -fsSL \
            -H "Authorization: Bearer ${TOKEN}" -H 'Accept: application/json' \
            "${PC_API}/products/${PRODUCT}/variants" \
            | jq -r --arg p "${{ vars.MARKETPLACE_PLAN_ID }}" '.value[] | select(.externalID == $p) | .id' | head -1)
          if [[ -z "$VARIANT" ]]; then
            echo "::error::plan '${{ vars.MARKETPLACE_PLAN_ID }}' not found in offer '${{ vars.MARKETPLACE_OFFER_ID }}'"
            exit 1
          fi

          echo "product=${PRODUCT}" >> "$GITHUB_OUTPUT"
          echo "variant=${VARIANT}" >> "$GITHUB_OUTPUT"
          echo "offer ${{ vars.MARKETPLACE_OFFER_ID }} -> product ${PRODUCT}"
          echo "plan  ${{ vars.MARKETPLACE_PLAN_ID }} -> variant ${VARIANT}"

      # Each release attaches a NEW version as the plan's draft. A plan may hold
      # only ONE draft, and the publish job below consumes it - so the slot is
      # free again by the next release. If a publish is ever skipped or fails
      # validation, the next run will stop here with
      # "Only one draft / preview CNAB bundle is allowed per publish";
      # clear the stale draft in Partner Center before retrying.
      - name: Attach the new version as the draft
        env:
          PRODUCT: ${{ steps.ids.outputs.product }}
          VARIANT: ${{ steps.ids.outputs.variant }}
          DIGEST: ${{ needs.build-bundle.outputs.digest }}
        run: |
          set -euo pipefail
          TOKEN=$(az account get-access-token --resource https://graph.microsoft.com --query accessToken -o tsv)
          echo "::add-mask::${TOKEN}"

          RES="container-plan-technical-configuration/${PRODUCT}/${VARIANT}"
          AUTH=(-H "Authorization: Bearer ${TOKEN}")

          curl -fsSL "${AUTH[@]}" -H 'Accept: application/json' \
            "${PI_API}/${RES}?\$version=2022-03-01-preview3" > current.json
          EXT_TYPE=$(jq -r '.clusterExtensionType // empty' current.json)
          echo "registered extension type: ${EXT_TYPE:-<none>}"
          jq -r '.cnabReferences[]? | "  already attached: \(.repositoryName):\(.tag)"' current.json

          WANTED="${{ vars.CLUSTER_EXTENSION_TYPE }}"
          if [[ -n "$EXT_TYPE" && "$EXT_TYPE" != "$WANTED" ]]; then
            echo "::error::CLUSTER_EXTENSION_TYPE is '${WANTED}' but the plan has '${EXT_TYPE}' registered."
            exit 1
          fi
          [[ -n "$EXT_TYPE" ]] || EXT_TYPE="$WANTED"

          # Keep every reference already on the plan and append the new one.
          # Published bundles are immutable and must stay; a re-run of the same
          # version replaces its own entry rather than duplicating it.
          REFS=$(jq -c --arg repo "${{ vars.ACR_REPOSITORY }}" --arg tag "$VERSION" \
                   --arg t "${{ vars.AZURE_TENANT_ID }}" --arg s "${{ vars.AZURE_SUBSCRIPTION_ID }}" \
                   --arg g "${{ vars.ACR_RESOURCE_GROUP }}" --arg r "${{ vars.ACR_NAME }}" \
                   --arg d "$DIGEST" '
            [ .cnabReferences[]? | select((.repositoryName != $repo) or (.tag != $tag)) ]
            + [ {tenantId:$t, subscriptionId:$s, resourceGroupName:$g, registryName:$r,
                 repositoryName:$repo, tag:$tag, digest:$d} ]' current.json)

          jq -n --arg id "$RES" --arg prod "product/${PRODUCT}" \
                --arg plan "plan/${PRODUCT}/${VARIANT}" --arg ext "$EXT_TYPE" \
                --argjson refs "$REFS" '{
            "$schema": "https://schema.mp.microsoft.com/schema/configure/2022-03-01-preview2",
            resources: [{
              "$schema": "https://schema.mp.microsoft.com/schema/container-plan-technical-configuration/2022-03-01-preview3",
              id: $id, product: $prod, plan: $plan,
              payloadType: "cnab", clusterExtensionType: $ext, cnabReferences: $refs
            }]
          }' > payload.json

          OUT=$(curl -sS -X POST "${AUTH[@]}" -H 'Content-Type: application/json' \
            --data @payload.json "${PI_API}/configure?\$version=2022-03-01-preview2")

          JOB=$(jq -r '.jobId // empty' <<<"$OUT"); STATE=$(jq -r '.jobStatus // empty' <<<"$OUT"); N=0
          while [[ -n "$JOB" && "$STATE" != "completed" && $N -lt 45 ]]; do
            sleep 2; N=$((N + 1))
            OUT=$(curl -sS "${AUTH[@]}" -H 'Accept: application/json' \
              "${PI_API}/configure/${JOB}/status?\$version=2022-03-01-preview2")
            STATE=$(jq -r '.jobStatus // empty' <<<"$OUT")
          done

          if [[ "$(jq -r '.jobResult // empty' <<<"$OUT")" != "succeeded" ]]; then
            echo "::error::failed to attach ${{ vars.ACR_REPOSITORY }}:${VERSION}"
            jq . <<<"$OUT" || echo "$OUT"
            exit 1
          fi
          echo "attached ${{ vars.ACR_REPOSITORY }}:${VERSION} as the plan's draft"

  # ---------------------------------------------------------------------------
  # 3. Verify the digest Partner Center reports matches what we built.
  # ---------------------------------------------------------------------------
  verify-sha:
    name: Verify package SHA
    needs: [build-bundle, update-package]
    if: ${{ !(inputs.dry_run || false) }}
    runs-on: [self-hosted, linux, x64, azure-marketplace]
    timeout-minutes: 30
    environment: azure-marketplace
    env:
      VERSION: ${{ needs.build-bundle.outputs.version }}
      PI_API: https://graph.microsoft.com/rp/product-ingestion
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.PARTNER_CENTER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Compare digests
        env:
          PRODUCT: ${{ needs.update-package.outputs.product }}
          VARIANT: ${{ needs.update-package.outputs.variant }}
          EXPECTED: ${{ needs.build-bundle.outputs.digest }}
        run: |
          set -euo pipefail
          TOKEN=$(az account get-access-token --resource https://graph.microsoft.com --query accessToken -o tsv)
          echo "::add-mask::${TOKEN}"

          curl -fsSL -H "Authorization: Bearer ${TOKEN}" -H 'Accept: application/json' \
            "${PI_API}/container-plan-technical-configuration/${PRODUCT}/${VARIANT}?\$version=2022-03-01-preview3" \
            > attached.json

          COUNT=$(jq '[.cnabReferences[]?] | length' attached.json)
          echo "expected digest: ${EXPECTED}"
          echo "attached to the plan (${COUNT}):"
          jq -r '.cnabReferences[]? | "  \(.repositoryName):\(.tag)  \(.digest)"' attached.json

          if [[ "$COUNT" -eq 0 ]]; then
            echo "::error::Partner Center reports no packages attached to the plan"
            exit 1
          fi
          if ! jq -e --arg d "$EXPECTED" 'any(.cnabReferences[]?; .digest == $d)' attached.json >/dev/null; then
            echo "::error::digest mismatch - the plan does not reference the bundle we built"
            exit 1
          fi
          if [[ "$COUNT" -gt 1 ]]; then
            echo "::warning::plan holds ${COUNT} packages; published bundles cannot be detached."
          fi
          echo "SHA verified."
          {
            echo "### SHA verified"
            echo ""
            echo "Published \`${VERSION}\` with digest \`${EXPECTED}\`"
            echo ""
            echo "Packages attached to the plan (\`${COUNT}\`):"
            echo ""
            jq -r '.cnabReferences[]? | "- `\(.repositoryName):\(.tag)`"' attached.json
            echo ""
            echo "Azure-side validation runs next. **Publish manually in Partner Center** once it passes."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 4. Publish the draft.
  #
  # Publishing goes through the SAME /configure endpoint as the package change -
  # it is just a different resource type. Omitting `id` publishes ALL draft
  # changes on the product, which is what we want: the only draft change is the
  # package we just attached and verified.
  #
  # target=preview  submits for validation and lands in front of the preview
  #                 audience; a human still clicks go-live.
  # target=live     ships to all customers.
  # target=none     skip (attach and verify only).
  #
  # Microsoft's validation runs asynchronously after this returns, and can take
  # hours. A successful job here means the submission was ACCEPTED, not that it
  # passed validation - watch Partner Center for that.
  # ---------------------------------------------------------------------------
  publish-submission:
    name: Publish submission
    needs: [build-bundle, update-package, verify-sha]
    if: >-
      ${{ !(inputs.dry_run || false)
          && (inputs.publish_target || vars.MARKETPLACE_PUBLISH_TARGET || 'preview') != 'none' }}
    runs-on: [self-hosted, linux, x64, azure-marketplace]
    timeout-minutes: 30
    environment: azure-marketplace
    env:
      VERSION: ${{ needs.build-bundle.outputs.version }}
      PI_API: https://graph.microsoft.com/rp/product-ingestion
      TARGET: ${{ inputs.publish_target || vars.MARKETPLACE_PUBLISH_TARGET || 'preview' }}
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.PARTNER_CENTER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish draft changes
        env:
          PRODUCT: ${{ needs.update-package.outputs.product }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            preview|live) ;;
            *) echo "::error::publish target must be preview, live or none - got '${TARGET}'"; exit 1 ;;
          esac

          TOKEN=$(az account get-access-token --resource https://graph.microsoft.com --query accessToken -o tsv)
          echo "::add-mask::${TOKEN}"
          AUTH=(-H "Authorization: Bearer ${TOKEN}")

          echo "publishing all draft changes on product/${PRODUCT} to '${TARGET}'"
          # No `id`: publishes every draft resource on the product.
          jq -n --arg prod "product/${PRODUCT}" --arg target "$TARGET" '{
            "$schema": "https://schema.mp.microsoft.com/schema/configure/2022-03-01-preview2",
            resources: [{
              "$schema": "https://schema.mp.microsoft.com/schema/submission/2022-03-01-preview2",
              product: $prod,
              target: { targetType: $target }
            }]
          }' > submit.json

          OUT=$(curl -sS -X POST "${AUTH[@]}" -H 'Content-Type: application/json' \
            --data @submit.json "${PI_API}/configure?\$version=2022-03-01-preview2")

          JOB=$(jq -r '.jobId // empty' <<<"$OUT")
          if [[ -z "$JOB" ]]; then
            echo "::error::publish to '${TARGET}' was rejected outright"
            jq . <<<"$OUT" || echo "$OUT"
            exit 1
          fi

          # Microsoft's validation runs INSIDE this job and takes minutes to
          # hours. Waiting for it would hold the runner for no benefit and make
          # the release look failed whenever validation is simply slow. So poll
          # briefly - just long enough to catch an outright rejection - then
          # hand off and report where to watch it.
          STATE=$(jq -r '.jobStatus // empty' <<<"$OUT"); N=0
          while [[ "$STATE" != "completed" && $N -lt 5 ]]; do
            sleep 3; N=$((N + 1))
            OUT=$(curl -sS "${AUTH[@]}" -H 'Accept: application/json' \
              "${PI_API}/configure/${JOB}/status?\$version=2022-03-01-preview2")
            STATE=$(jq -r '.jobStatus // empty' <<<"$OUT")
            jq -e '(.errors // []) | length > 0' >/dev/null <<<"$OUT" && break
          done

          RESULT=$(jq -r '.jobResult // empty' <<<"$OUT")
          if jq -e '(.errors // []) | length > 0' >/dev/null <<<"$OUT" || [[ "$RESULT" == "failed" ]]; then
            echo "::error::publish to '${TARGET}' failed"
            jq . <<<"$OUT" || echo "$OUT"
            exit 1
          fi

          OFFER_URL="https://partner.microsoft.com/dashboard/commercial-marketplace/offers/${{ vars.MARKETPLACE_OFFER_ID }}/overview"
          STATUS_URL="${PI_API}/configure/${JOB}/status?\$version=2022-03-01-preview2"

          echo "submission accepted for '${TARGET}'"
          echo "  job          : ${JOB}"
          echo "  state        : ${STATE:-running} / ${RESULT:-pending}"
          echo "  track here   : ${OFFER_URL}"
          echo "::notice::Publish to '${TARGET}' is IN PROGRESS - this workflow does not wait for it. Track: ${OFFER_URL}"

          {
            echo "### Submitted to \`${TARGET}\` - validation in progress"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| package | \`${{ vars.ACR_REPOSITORY }}:${VERSION}\` |"
            echo "| target | \`${TARGET}\` |"
            echo "| submission job | \`${JOB}\` |"
            echo "| state at hand-off | \`${STATE:-running}\` / \`${RESULT:-pending}\` |"
            echo ""
            echo "**Microsoft validation runs asynchronously and can take hours. This workflow does not wait for it** - a green run means the submission was accepted, not that it passed."
            echo ""
            echo "- Track progress: [Partner Center offer overview](${OFFER_URL})"
            if [[ "$TARGET" == "preview" ]]; then
              echo "- Once validation passes, **go live manually** in Partner Center."
            else
              echo "- Once validation passes, the offer goes **live to all customers** automatically."
            fi
            echo ""
            echo "Check the submission job from a shell:"
            echo ""
            echo '```bash'
            echo "TOKEN=\$(az account get-access-token --resource https://graph.microsoft.com --query accessToken -o tsv)"
            echo "curl -s -H \"Authorization: Bearer \$TOKEN\" \\"
            echo "  '${STATUS_URL}' | jq '{jobStatus, jobResult, errors}'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Always reports, including on failure, cancellation and timeout.
  # ---------------------------------------------------------------------------
  notify-result:
    name: Notify - result
    needs: [build-bundle, update-package, verify-sha, publish-submission]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL_MARKETPLACE }}
    steps:
      - name: Compute outcome
        id: outcome
        run: |
          set -euo pipefail
          # Treat cancelled as failure: an unattended pipeline must never read
          # "cancelled" as "fine".
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || \
                "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "state=failure" >> "$GITHUB_OUTPUT"
            echo "text=:x: Azure Marketplace release FAILED - pipeline stopped" >> "$GITHUB_OUTPUT"
          elif [[ "${{ inputs.dry_run || false }}" == "true" ]]; then
            echo "state=success" >> "$GITHUB_OUTPUT"
            echo "text=:test_tube: Azure Marketplace DRY RUN complete - bundle in ACR, Partner Center untouched" >> "$GITHUB_OUTPUT"
          else
            echo "state=success" >> "$GITHUB_OUTPUT"
            echo "text=:white_check_mark: Azure Marketplace release submitted - validation in progress, watch Partner Center" >> "$GITHUB_OUTPUT"
          fi
      - name: Slack
        if: env.SLACK_WEBHOOK != ''
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_MARKETPLACE }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ steps.outcome.outputs.text }}",
              "tag": "${{ inputs.tag || github.ref_name }}",
              "version": "${{ needs.build-bundle.outputs.version }}",
              "build": "${{ needs.build-bundle.result }}",
              "update": "${{ needs.update-package.result }}",
              "verify": "${{ needs.verify-sha.result }}",
              "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
      - name: Fail the run if any stage failed
        if: ${{ steps.outcome.outputs.state == 'failure' }}
        run: |
          echo "::error::one or more stages failed - see job results above"
          exit 1