name: Integ Test
on:
  push:
    branches:
      - main
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches:
      - main
      - release-*
  workflow_dispatch:
    inputs:
      operator_image_tag:
        description: 'EKS-GPU only: operator image tag (manager.image.tag); empty means the chart default'
        required: false
        default: ''
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  TERRAFORM_AWS_ASSUME_ROLE: ${{ secrets.TERRAFORM_AWS_ASSUME_ROLE }}
  AWS_DEFAULT_REGION: us-west-2

jobs:
  Build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      # golangci-lint v1.64.2 (Makefile) is built with go1.24 and runs out of memory
      # when the runner's default Go is newer. Pin the Go used by `make all`.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24.x'
          cache: false
      - name: Build
        run: make all

  Minikube-IntegrationTests:
    name: Minikube
    needs: [ Build ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        # TODO: add webhooks-disabled
        # Keep sorted alphabetically.
        scenario:
          - agent-config-merge-isolation
          - aks-otel-container-insights
          - appsignals-disabled
          - appsignals-disabled-multi-agents
          - appsignals-enabled-multi-agents
          - appsignals-unsupported
          - cert-manager-enabled
          - certificate-recreate-disabled
          - certificate-recreate-enabled
          - configmap-permission-scoping
          - default
          - default-otel
          - deployment-rolling-disabled
          - deployment-rolling-enabled
          - dualstack-endpoint-enabled
          - dualstack-endpoint-with-custom-endpoint
          - feature-targeted-agent-config-override
          - feature-targeted-appsignals-disabled
          - feature-targeted-ci-and-appsignals-disabled
          - feature-targeted-ci-disabled
          - feature-targeted-custom-otel-config
          - feature-targeted-default
          - feature-targeted-multi-agent
          - feature-targeted-otlp-disabled
          - feature-targeted-split-features
          - feature-targeted-user-config-override
          - multi-agent-leader-election
          - otlp-custom-otel-config
          - otlp-default
          - otlp-disabled
          - otlp-disabled-flag
          - otlp-hybrid-metrics-fluentbit
          - otlp-logs-disabled
          - otlp-logs-dual-publish
          - otlp-logs-otel-only
          - service-events-unsupported
          - webhooks-configured
          - webhooks-partially-enabled
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - name: Read K8s version from Terraform
        id: k8s
        run: |
          version=$(awk -F'"' '/default *=/{print $2; exit}' \
            integration-tests/amazon-cloudwatch-observability/terraform/minikube/variables.tf)
          if [ -z "${version}" ]; then
            echo "::error::Failed to extract k8s_version default from variables.tf"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Start minikube
        uses: medyagh/setup-minikube@e9e035a86bbc3caea26a450bd4dbf9d0c453682e # v0.0.21
        with:
          driver: docker
          kubernetes-version: ${{ steps.k8s.outputs.version }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.1.7"

      - name: Run scenario test
        run: |
          cd integration-tests/amazon-cloudwatch-observability/terraform/minikube/scenarios/${{ matrix.scenario }}
          terraform init
          terraform apply -auto-approve
          terraform destroy -auto-approve

      - name: Cleanup on failure
        if: ${{ cancelled() || failure() }}
        run: |
          cd integration-tests/amazon-cloudwatch-observability/terraform/minikube/scenarios/${{ matrix.scenario }}
          terraform destroy -auto-approve || true

  EKS-IntegrationTest:
    name: EKS
    needs: [ Minikube-IntegrationTests ]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0

      - name: Generate testing id
        run: echo TESTING_ID="${{ github.run_id }}-${{ github.run_number }}" >> $GITHUB_ENV

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@5fd3084fc36e372ff1fff382a39b10d03659f355 # v2.2.0
        with:
          role-to-assume: ${{ env.TERRAFORM_AWS_ASSUME_ROLE }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      #  local directory to store the kubernetes config
      - name: Create kubeconfig directory
        run: mkdir -p ${{ github.workspace }}/../../../.kube

      - name: Set KUBECONFIG environment variable
        run: echo KUBECONFIG="${{ github.workspace }}/../../../.kube/config" >> $GITHUB_ENV

      - name: Install Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.1.7"

      - name: Verify Terraform version
        run: terraform --version

      - name: Terraform apply
        uses: nick-fields/retry@14672906e672a08bd6eeb15720e9ed3ce869cdd4 # v2.9.0
        with:
          max_attempts: 1
          timeout_minutes: 60 # EKS takes about 20 minutes to spin up a cluster and service on the cluster
          retry_wait_seconds: 5
          command: |
            cd integration-tests/amazon-cloudwatch-observability/terraform/eks
            terraform init
            if terraform apply -auto-approve \
                -var="kube_dir=${{ github.workspace }}/../../../.kube"; then
              terraform destroy -auto-approve
            else
              terraform destroy -auto-approve && exit 1
            fi

      - name: Terraform destroy
        if: ${{ cancelled() || failure() }}
        uses: nick-fields/retry@14672906e672a08bd6eeb15720e9ed3ce869cdd4 # v2.9.0
        with:
          max_attempts: 3
          timeout_minutes: 8
          retry_wait_seconds: 5
          command: |
            cd integration-tests/amazon-cloudwatch-observability/terraform/eks
            terraform destroy --auto-approve

  # Java profiling with Application Signals, end to end. Manual runs only, and not in verify-all yet: it needs
  # operator and agent images with Java profiling (agent v1.300075.0 or later), which the chart defaults do not
  # have yet. Set the JAVA_PROFILING_* repository variables to test other images; empty means the chart default.
  EKS-JavaProfilingIntegrationTest:
    name: EKS-JavaProfiling
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [ Minikube-IntegrationTests ]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0

      - name: Generate testing id
        run: echo TESTING_ID="${{ github.run_id }}-${{ github.run_number }}" >> $GITHUB_ENV

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@5fd3084fc36e372ff1fff382a39b10d03659f355 # v2.2.0
        with:
          role-to-assume: ${{ env.TERRAFORM_AWS_ASSUME_ROLE }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      #  local directory to store the kubernetes config
      - name: Create kubeconfig directory
        run: mkdir -p ${{ github.workspace }}/../../../.kube

      - name: Set KUBECONFIG environment variable
        run: echo KUBECONFIG="${{ github.workspace }}/../../../.kube/config" >> $GITHUB_ENV

      - name: Install Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.1.7"

      - name: Verify Terraform version
        run: terraform --version

      - name: Terraform apply
        uses: nick-fields/retry@14672906e672a08bd6eeb15720e9ed3ce869cdd4 # v2.9.0
        with:
          max_attempts: 1
          timeout_minutes: 80 # EKS about 20 minutes, rollout up to 10, telemetry wait up to 15, destroy about 15
          retry_wait_seconds: 5
          command: |
            cd integration-tests/amazon-cloudwatch-observability/terraform/eks/java-profiling
            terraform init
            if terraform apply -auto-approve \
                -var="kube_dir=${{ github.workspace }}/../../../.kube" \
                -var="operator_image_domain=${{ vars.JAVA_PROFILING_OPERATOR_IMAGE_DOMAIN }}" \
                -var="operator_image_tag=${{ vars.JAVA_PROFILING_OPERATOR_IMAGE_TAG }}" \
                -var="agent_image_domain=${{ vars.JAVA_PROFILING_AGENT_IMAGE_DOMAIN }}" \
                -var="agent_image_repository=${{ vars.JAVA_PROFILING_AGENT_IMAGE_REPOSITORY }}" \
                -var="agent_image_tag=${{ vars.JAVA_PROFILING_AGENT_IMAGE_TAG }}"; then
              terraform destroy -auto-approve
            else
              terraform destroy -auto-approve && exit 1
            fi

      - name: Terraform destroy
        if: ${{ cancelled() || failure() }}
        uses: nick-fields/retry@14672906e672a08bd6eeb15720e9ed3ce869cdd4 # v2.9.0
        with:
          max_attempts: 3
          timeout_minutes: 8
          retry_wait_seconds: 5
          command: |
            cd integration-tests/amazon-cloudwatch-observability/terraform/eks/java-profiling
            terraform destroy --auto-approve

  # DCGM Exporter on a g4dn.xlarge GPU node: fails if dcgm-exporter is not Ready, restarts, or serves no
  # DCGM_FI_ series. A GPU node costs money, so the AWS steps run only on manual runs and on changes to the
  # manager or dcgmExporter image block in the chart's values.yaml (.github/scripts/gpu_test_gate.sh).
  # Otherwise every later step skips and the job still ends in success, which verify-all requires.
  EKS-IntegrationTest-GPU:
    name: EKS GPU
    needs: [ Minikube-IntegrationTests ]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0

      - name: Decide whether to run the GPU test
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          case "$EVENT_NAME" in
            workflow_dispatch) run=true ;;
            pull_request) run=$(bash .github/scripts/gpu_test_gate.sh "origin/$BASE_REF" HEAD) ;;
            push) run=$(bash .github/scripts/gpu_test_gate.sh "$BEFORE_SHA" HEAD) ;;
            *) run=false ;;
          esac
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "GPU test runs: $run"

      - name: Generate testing id
        if: steps.gate.outputs.run == 'true'
        run: echo TESTING_ID="${{ github.run_id }}-${{ github.run_number }}" >> $GITHUB_ENV

      - name: Configure AWS Credentials
        if: steps.gate.outputs.run == 'true'
        uses: aws-actions/configure-aws-credentials@5fd3084fc36e372ff1fff382a39b10d03659f355 # v2.2.0
        with:
          role-to-assume: ${{ env.TERRAFORM_AWS_ASSUME_ROLE }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      #  local directory to store the kubernetes config
      - name: Create kubeconfig directory
        if: steps.gate.outputs.run == 'true'
        run: mkdir -p ${{ github.workspace }}/../../../.kube

      - name: Set KUBECONFIG environment variable
        if: steps.gate.outputs.run == 'true'
        run: echo KUBECONFIG="${{ github.workspace }}/../../../.kube/config" >> $GITHUB_ENV

      - name: Install Terraform
        if: steps.gate.outputs.run == 'true'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.1.7"

      - name: Verify Terraform version
        if: steps.gate.outputs.run == 'true'
        run: terraform --version

      - name: Terraform apply
        if: steps.gate.outputs.run == 'true'
        uses: nick-fields/retry@14672906e672a08bd6eeb15720e9ed3ce869cdd4 # v2.9.0
        env:
          OPERATOR_IMAGE_TAG: ${{ inputs.operator_image_tag }}
        with:
          max_attempts: 1
          timeout_minutes: 70 # EKS about 20 minutes, device plugin and chart up to 10, validator up to 20, destroy about 15
          retry_wait_seconds: 5
          command: |
            cd integration-tests/amazon-cloudwatch-observability/terraform/eks/gpu
            terraform init
            if terraform apply -auto-approve \
                -var="kube_dir=${{ github.workspace }}/../../../.kube" \
                -var="operator_image_tag=${OPERATOR_IMAGE_TAG}"; then
              terraform destroy -auto-approve
            else
              terraform destroy -auto-approve && exit 1
            fi

      - name: Terraform destroy
        if: ${{ (cancelled() || failure()) && steps.gate.outputs.run == 'true' }}
        uses: nick-fields/retry@14672906e672a08bd6eeb15720e9ed3ce869cdd4 # v2.9.0
        with:
          max_attempts: 3
          timeout_minutes: 8
          retry_wait_seconds: 5
          command: |
            cd integration-tests/amazon-cloudwatch-observability/terraform/eks/gpu
            terraform destroy --auto-approve

  EKS-IntegrationTest-Win2022:
    name: EKS Win2022
    needs: [ Minikube-IntegrationTests ]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0

      - name: Generate testing id
        run: echo TESTING_ID="${{ github.run_id }}-${{ github.run_number }}" >> $GITHUB_ENV

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@5fd3084fc36e372ff1fff382a39b10d03659f355 # v2.2.0
        with:
          role-to-assume: ${{ env.TERRAFORM_AWS_ASSUME_ROLE }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      #  local directory to store the kubernetes config
      - name: Create kubeconfig directory
        run: mkdir -p ${{ github.workspace }}/../../../.kube

      - name: Set KUBECONFIG environment variable
        run: echo KUBECONFIG="${{ github.workspace }}/../../../.kube/config" >> $GITHUB_ENV

      - name: Install Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.1.7"

      - name: Verify Terraform version
        run: terraform --version

      - name: Terraform apply
        uses: nick-fields/retry@14672906e672a08bd6eeb15720e9ed3ce869cdd4 # v2.9.0
        with:
          max_attempts: 1
          timeout_minutes: 60 # EKS takes about 20 minutes to spin up a cluster and service on the cluster
          retry_wait_seconds: 5
          command: |
            cd integration-tests/amazon-cloudwatch-observability/terraform/eks/windows
            terraform init
            if terraform apply -auto-approve \
                -var="windows_os_version=WINDOWS_CORE_2022_x86_64" -var="kube_dir=${{ github.workspace }}/../../../.kube"; then
              terraform destroy -auto-approve
            else
              terraform destroy -auto-approve && exit 1
            fi

      - name: Terraform destroy
        if: ${{ cancelled() || failure() }}
        uses: nick-fields/retry@14672906e672a08bd6eeb15720e9ed3ce869cdd4 # v2.9.0
        with:
          max_attempts: 3
          timeout_minutes: 8
          retry_wait_seconds: 5
          command: |
            cd integration-tests/amazon-cloudwatch-observability/terraform/eks/windows
            terraform destroy --auto-approve

  EKS-IntegrationTest-Win2019:
    name: EKS Win2019
    needs: [ Minikube-IntegrationTests ]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0

      - name: Generate testing id
        run: echo TESTING_ID="${{ github.run_id }}-${{ github.run_number }}" >> $GITHUB_ENV

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@5fd3084fc36e372ff1fff382a39b10d03659f355 # v2.2.0
        with:
          role-to-assume: ${{ env.TERRAFORM_AWS_ASSUME_ROLE }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      #  local directory to store the kubernetes config
      - name: Create kubeconfig directory
        run: mkdir -p ${{ github.workspace }}/../../../.kube

      - name: Set KUBECONFIG environment variable
        run: echo KUBECONFIG="${{ github.workspace }}/../../../.kube/config" >> $GITHUB_ENV

      - name: Install Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.1.7"

      - name: Verify Terraform version
        run: terraform --version

      - name: Terraform apply
        uses: nick-fields/retry@14672906e672a08bd6eeb15720e9ed3ce869cdd4 # v2.9.0
        with:
          max_attempts: 1
          timeout_minutes: 60 # EKS takes about 20 minutes to spin up a cluster and service on the cluster
          retry_wait_seconds: 5
          command: |
            cd integration-tests/amazon-cloudwatch-observability/terraform/eks/windows
            terraform init
            if terraform apply -auto-approve \
                -var="windows_os_version=WINDOWS_CORE_2019_x86_64" -var="kube_dir=${{ github.workspace }}/../../../.kube"; then
              terraform destroy -auto-approve
            else
              terraform destroy -auto-approve && exit 1
            fi

      - name: Terraform destroy
        if: ${{ cancelled() || failure() }}
        uses: nick-fields/retry@14672906e672a08bd6eeb15720e9ed3ce869cdd4 # v2.9.0
        with:
          max_attempts: 3
          timeout_minutes: 8
          retry_wait_seconds: 5
          command: |
            cd integration-tests/amazon-cloudwatch-observability/terraform/eks/windows
            terraform destroy --auto-approve

  verify-all:
    name: Verify All Integration Test Jobs
    needs: [ Build, Minikube-IntegrationTests, EKS-IntegrationTest, EKS-IntegrationTest-GPU,
             EKS-IntegrationTest-Win2022, EKS-IntegrationTest-Win2019 ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check Job Status
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failed_jobs=()
          successful_jobs=()

          # Every needed job must report success. Any other result (failure, cancelled, or
          # skipped) blocks the merge, so a cancelled or partial run can never appear green.
          for job in $(echo "$NEEDS_JSON" | jq -r 'keys[]'); do
            result=$(echo "$NEEDS_JSON" | jq -r ".[\"$job\"].result")

            if [[ "$result" == "success" ]]; then
              successful_jobs+=("$job")
            else
              failed_jobs+=("$job ($result)")
            fi
          done

          echo "Successfully validated jobs:"
          printf '%s\n' "${successful_jobs[@]}"

          if [ ${#failed_jobs[@]} -ne 0 ]; then
            echo -e "\nJobs that did not succeed:"
            printf '%s\n' "${failed_jobs[@]}"
            exit 1
          fi

          echo -e "\nAll required jobs completed successfully!"
